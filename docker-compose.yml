services:
  redis:
    image: redis:7
    container_name: redis-demo
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redis_demo_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_demo_data: